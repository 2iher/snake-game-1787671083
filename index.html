<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #2c3e50;
      color: #ecf0f1;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-top: 0;
    }
    canvas {
      background-color: #34495e;
      border: 4px solid #bdc3c7;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      max-width: 100%;
      height: auto;
      touch-action: none;
    }
    #score-board {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .instructions {
      margin-top: 15px;
      font-size: 16px;
      color: #bdc3c7;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Snake</h1>
  <div id="score-board">
    <span>Score: <span id="score">0</span></span>
    <span>High Score: <span id="high-score">0</span></span>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div class="instructions">Use Arrow Keys or Swipe to move. Tap or press any key to start.</div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const highScoreElement = document.getElementById("high-score");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    
    let snake = [{x: 10, y: 10}];
    let food = {x: 5, y: 5};
    let dx = 0;
    let dy = 0;
    let score = 0;
    let highScore = localStorage.getItem("snakeHighScore") || 0;
    highScoreElement.textContent = highScore;
    
    let gameInterval;
    let gameStarted = false;

    function drawSnakePart(snakePart, index) {
      ctx.fillStyle = index === 0 ? "#2ecc71" : "#27ae60"; // Head is lighter green
      ctx.strokeStyle = "#2c3e50";
      ctx.fillRect(snakePart.x * gridSize, snakePart.y * gridSize, gridSize, gridSize);
      ctx.strokeRect(snakePart.x * gridSize, snakePart.y * gridSize, gridSize, gridSize);
    }

    function drawFood() {
      ctx.fillStyle = "#e74c3c";
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2, 
        food.y * gridSize + gridSize / 2, 
        gridSize / 2 - 2, 
        0, 
        Math.PI * 2
      );
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawFood();
      snake.forEach(drawSnakePart);
    }

    function moveSnake() {
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};
      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElement.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreElement.textContent = highScore;
          localStorage.setItem("snakeHighScore", highScore);
        }
        generateFood();
      } else {
        snake.pop();
      }
    }

    function generateFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);
      
      // Ensure food doesn't spawn on snake
      for(let part of snake) {
        if(part.x === food.x && part.y === food.y) {
          generateFood();
          return;
        }
      }
    }

    function checkCollision() {
      const head = snake[0];
      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        return true;
      }
      // Self collision
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          return true;
        }
      }
      return false;
    }

    function resetGame() {
      snake = [{x: 10, y: 10}];
      dx = 0;
      dy = 0;
      score = 0;
      scoreElement.textContent = score;
      gameStarted = false;
      generateFood();
      draw();
    }

    function gameLoop() {
      if (checkCollision()) {
        clearInterval(gameInterval);
        alert(`Game Over! Final Score: ${score}`);
        resetGame();
        return;
      }
      moveSnake();
      draw();
    }

    document.addEventListener("keydown", (e) => {
      // Prevent default scrolling for arrow keys
      if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
          e.preventDefault();
      }

      if (!gameStarted && (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        gameStarted = true;
        gameInterval = setInterval(gameLoop, 100);
      }
      
      const goingUp = dy === -1;
      const goingDown = dy === 1;
      const goingRight = dx === 1;
      const goingLeft = dx === -1;

      if (e.key === 'ArrowLeft' && !goingRight) { dx = -1; dy = 0; }
      if (e.key === 'ArrowUp' && !goingDown) { dx = 0; dy = -1; }
      if (e.key === 'ArrowRight' && !goingLeft) { dx = 1; dy = 0; }
      if (e.key === 'ArrowDown' && !goingUp) { dx = 0; dy = 1; }
    });

    let touchStartX = 0;
    let touchStartY = 0;

    document.addEventListener('touchstart', function(e) {
      if (e.target === canvas) {
        e.preventDefault();
      }
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
      
      if (!gameStarted) {
        gameStarted = true;
        gameInterval = setInterval(gameLoop, 100);
      }
    }, {passive: false});

    document.addEventListener('touchmove', function(e) {
      if (e.target === canvas) {
        e.preventDefault();
      }
    }, {passive: false});

    document.addEventListener('touchend', function(e) {
      let touchEndX = e.changedTouches[0].screenX;
      let touchEndY = e.changedTouches[0].screenY;
      
      handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
    });

    function handleSwipe(startX, startY, endX, endY) {
      const diffX = endX - startX;
      const diffY = endY - startY;
      
      if (Math.abs(diffX) < 30 && Math.abs(diffY) < 30) return;

      const goingUp = dy === -1;
      const goingDown = dy === 1;
      const goingRight = dx === 1;
      const goingLeft = dx === -1;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 0 && !goingLeft) { dx = 1; dy = 0; }
        else if (diffX < 0 && !goingRight) { dx = -1; dy = 0; }
      } else {
        if (diffY > 0 && !goingUp) { dx = 0; dy = 1; }
        else if (diffY < 0 && !goingDown) { dx = 0; dy = -1; }
      }
    }

    generateFood();
    draw();
  </script>
</body>
</html>
